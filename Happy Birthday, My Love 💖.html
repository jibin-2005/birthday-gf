<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Happy Birthday, My Love 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--bg:#12060f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 30px;text-align:center;opacity:0;transition:opacity .7s;pointer-events:none;isolation:isolate;overflow:hidden}
.slide.on{opacity:1}
.slide.on>*{animation:up .9s both}
.slide.on>*:nth-child(2){animation-delay:.25s}.slide.on>*:nth-child(3){animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.pb::before{content:'';position:absolute;inset:-30px;background:var(--p) center/cover;filter:blur(26px) brightness(.45);z-index:-1}
.sharp::before{inset:0;filter:brightness(.62)}
.sharp::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 35%,#000b);z-index:-1}
.end{justify-content:flex-end;padding-bottom:max(90px,12vh)}
.script{font-family:'Great Vibes',cursive;font-size:3.1rem;line-height:1.15;text-shadow:0 2px 14px #0008}
.big{font-family:'Great Vibes',cursive;font-size:4rem;line-height:1.1;text-shadow:0 2px 14px #0008}
.q{font-size:1.2rem;font-weight:300;line-height:1.7;max-width:320px;text-shadow:0 2px 12px #0009}
.by{margin-top:18px;font-size:.8rem;letter-spacing:.2em;opacity:.8;text-transform:uppercase}
.photo{width:100%;max-width:330px;aspect-ratio:5/6;border-radius:22px;background:var(--p) center/cover;box-shadow:0 20px 50px #000a;border:3px solid #fff3;transform:rotate(-2deg)}
.slide.alt .photo{transform:rotate(2deg)}
.cap{margin-top:22px;font-size:1.05rem;font-weight:300;line-height:1.6;max-width:320px;text-shadow:0 2px 12px #0009}
.msg{margin:14px 0 4px;font-size:1.12rem;font-weight:300;line-height:1.8;max-width:330px;text-shadow:0 2px 12px #000a}
#bars{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px;z-index:5}
#bars i{flex:1;height:3px;border-radius:2px;background:#fff4;overflow:hidden}
#bars b{display:block;height:100%;width:0;background:#fff}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.h{position:absolute;bottom:-30px;animation:fl linear forwards;opacity:.8}
@keyframes fl{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
#cover{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#5a1646,#12060f);cursor:pointer;text-align:center;padding:30px;transition:opacity .6s}
#cover .gift{font-size:5rem;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
#cover p{margin-top:14px;opacity:.75;font-size:.9rem}
</style></head><body>
<div id="stage">
  <div id="cover"><div class="gift">🎁</div><div class="script" style="margin-top:10px">A surprise for you…</div><p>Tap to open</p></div>
  <div id="bars"></div><div class="hearts" id="hearts"></div>
</div>

 {k:'forest',m:'photo',cap:"I’d carry you through every season."},
 {k:'beach',html:`<div class="script">I wish you…</div><p class="cap">endless happiness, big dreams that come true, and a year as beautiful as your heart. I’ll be right beside you for every bit of it.</p>`},
 {k:'sun1',dur:9500,html:`<div class="script">Dearest wife,</div><p class="msg">Wishing you the happiest birthday! I love you so much. You are like a second mother to me — I feel so safe and cared for whenever I am with you.</p><div class="big" style="font-size:2.8rem;margin-top:14px">Mwaahh 😘</div>`},
 {k:'carry',m:'bg',end:1,html:`<div class="big">I love you 💖</div><p class="cap">Happy Birthday, my favourite person in the whole world. 🎂</p>`}
];
const st=document.getElementById('stage'),bars=document.getElementById('bars'),cov=document.getElementById('cover');
let pi=0;
S.forEach(s=>{
 const d=document.createElement('div');d.className='slide';
 if(s.k){d.style.setProperty('--p',`url("${IMG[s.k]}")`);d.classList.add('pb');if(s.m==='bg')d.classList.add('sharp');}
 else d.style.background=`linear-gradient(160deg,${s.g.split(',')[0]},${s.g.split(',')[1]})`;
 if(s.end)d.classList.add('end');
 if(s.m==='photo'){d.innerHTML=`<div class="photo"></div><p class="cap">${s.cap}</p>`;if(pi++%2)d.classList.add('alt')}
 else d.innerHTML=s.html;
 st.insertBefore(d,cov);bars.innerHTML+='<i><b></b></i>';
});
const sl=[...document.querySelectorAll('.slide')],fills=[...bars.querySelectorAll('b')];
let cur=-1,start=0,paused=false,elapsed=0;const DUR=5500,dur=()=>S[cur].dur||DUR;
function go(n){
 n=Math.max(0,Math.min(n,S.length-1));
 if(n===S.length-1&&cur!==n)burst();
 cur=n;elapsed=0;start=performance.now();
 sl.forEach((x,i)=>x.classList.toggle('on',i===n));
 fills.forEach((f,i)=>f.style.width=i<n?'100%':'0');
}
function tick(now){
 if(cur>=0){
  if(paused)start=now-elapsed;else elapsed=now-start;
  fills[cur].style.width=Math.min(100,elapsed/dur()*100)+'%';
  if(elapsed>=dur()&&cur<S.length-1)go(cur+1);
 }
 requestAnimationFrame(tick);
}
function heart(){
 const h=document.createElement('div');h.className='h';
 h.textContent=['💖','💕','✨','🌸','💗'][Math.random()*5|0];
 h.style.left=Math.random()*100+'%';h.style.fontSize=(14+Math.random()*22)+'px';
 h.style.animationDuration=(5+Math.random()*5)+'s';
 document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),10000);
}
function burst(){for(let i=0;i<30;i++)setTimeout(heart,i*80)}
setInterval(heart,1100);
st.addEventListener('pointerdown',()=>{if(cur>=0){paused=true;st._t=Date.now()}});
st.addEventListener('pointerup',e=>{
 if(cur<0)return;paused=false;
 if(Date.now()-st._t<250){const r=st.getBoundingClientRect();go(e.clientX-r.left<r.width/3?cur-1:cur+1)}
});
cov.addEventListener('click',function(){this.style.opacity=0;setTimeout(()=>this.remove(),600);burst();go(0)});
requestAnimationFrame(tick);
</script></body></html>
